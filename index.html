<style>
/* Layout: Handy-App in einer schmalen Spalte. Hintergründe neutral (Weiss, im Dunkelmodus Schwarz).
   Grün nur auf der Willkommensseite und auf den dunklen Kopfkarten. Rot und Grün bleiben für Kontostände. */
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-2: #f0f2f4;
  --ink: #0f1417;
  --muted: #66707a;
  --line: #e2e6ea;
  --nav: #ffffff;
  --hero: #12261f;
  --hero-2: #21493d;
  --hero-ink: #f0f7f4;
  --hero-muted: #a8bdb7;
  --accent: #1d6b58;
  --mint: #9fe3c6;
  --mint-ink: #0f3a2d;
  --btn: #12201b;
  --btn-ink: #ffffff;
  --neg: #b4332c;
  --neg-bg: #fbeceb;
  --pos: #16723d;
  --pos-bg: #e1f3e8;
  --warn: #b5521d;
  --warn-bg: #fdeee2;
  --neg-hi: #ff9d94;
  --pos-hi: #7fe0a6;
  --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a;
    --surface: #151517;
    --surface-2: #1f1f22;
    --ink: #f1f2f3;
    --muted: #9aa1a8;
    --line: #2a2a2e;
    --nav: #000000;
    --accent: #7fd9b6;
    --btn: #9fe3c6;
    --btn-ink: #0d2c22;
    --neg: #ff8f86;
    --neg-bg: #3a1e1d;
    --pos: #66d392;
    --pos-bg: #153122;
    --warn: #ffb184;
    --warn-bg: #3a281a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a;
  --surface: #151517;
  --surface-2: #1f1f22;
  --ink: #f1f2f3;
  --muted: #9aa1a8;
  --line: #2a2a2e;
  --nav: #000000;
  --accent: #7fd9b6;
  --btn: #9fe3c6;
  --btn-ink: #0d2c22;
  --neg: #ff8f86;
  --neg-bg: #3a1e1d;
  --pos: #66d392;
  --pos-bg: #153122;
  --warn: #ffb184;
  --warn-bg: #3a281a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.has-nav { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 1.05rem; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.tiny { font-size: 0.74rem; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.ico.fill { fill: currentColor; stroke: none; }

.top { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.top > div { min-width: 0; }
.crumb { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.round-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: 0 0 auto;
  background: var(--btn); color: var(--btn-ink); display: grid; place-items: center;
}
.round-btn:hover { filter: brightness(1.15); }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.btn {
  font: inherit; font-weight: 600; font-size: 0.92rem;
  min-height: 44px; padding: 8px 18px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn-primary:hover { background: var(--btn); filter: brightness(1.15); }
.btn-mint { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.btn-mint:hover { background: var(--mint); filter: brightness(1.06); }
.btn-block { width: 100%; min-height: 52px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn-danger { color: var(--neg); border-color: var(--neg); background: transparent; }
.btn-sm { min-height: 38px; padding: 6px 14px; font-size: 0.86rem; border-radius: 10px; }
a.btn, label.btn { display: inline-flex; align-items: center; text-decoration: none; }
:is(.plain, .btn, .card, .round-btn, .navbtn, .frow, .pc, .tip, .swatch, .symbtn, input, select, textarea, summary, .seg button, .svc button, .hd-btn, .hd-pill, .mi):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pill { display: inline-block; font-size: 0.72rem; font-weight: 600; line-height: 1; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill-ok { background: var(--pos-bg); color: var(--pos); }
.pill-wait { background: var(--warn-bg); color: var(--warn); }
.pill-gray { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill-mint { background: var(--mint); color: var(--mint-ink); }
.pill-dark { background: rgba(255,255,255,0.14); color: var(--hero-ink); }

.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.zero { color: var(--muted); }

.tile {
  width: 48px; height: 48px; border-radius: 14px; flex: 0 0 auto; color: #fff; overflow: hidden;
  display: grid; place-items: center; font-weight: 800; font-size: 1.02rem; letter-spacing: 0.01em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
}
.tile.lg { width: 70px; height: 70px; border-radius: 20px; font-size: 1.5rem; }
.tile img { width: 100%; height: 100%; object-fit: contain; padding: 9%; display: block; }
.tile .sym { width: 52%; height: 52%; stroke-width: 1.7; }
.avatar {
  width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto; color: #fff; overflow: hidden;
  display: grid; place-items: center; font-weight: 700; font-size: 0.95rem;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plain { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; display: inline-flex; }
.avatar.lgav { width: 70px; height: 70px; font-size: 1.3rem; }
.avatar .ico { width: 55%; height: 55%; }
.avatar.sm { width: 40px; height: 40px; }

/* Übersicht */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hello button.avatar { border: 0; padding: 0; cursor: pointer; }
.hero-card {
  background: linear-gradient(155deg, var(--hero-2), var(--hero));
  color: var(--hero-ink); border-radius: 24px; padding: 18px;
}
.hero-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero-k { color: var(--hero-muted); font-size: 0.9rem; }
.hero-v { margin-top: 6px; font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.hero-inner { margin-top: 14px; padding: 14px; border-radius: 16px; background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.1); }
.hi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hi { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hi small { display: block; color: var(--hero-muted); font-size: 0.74rem; }
.hi b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.hico { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.12); display: grid; place-items: center; flex: 0 0 auto; }
.hico.ok { background: var(--mint); color: var(--mint-ink); border-radius: 50%; }
.bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.16); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 999px; }
.hi-foot { margin-top: 8px; text-align: right; font-size: 0.78rem; color: var(--hero-muted); font-variant-numeric: tabular-nums; }
.hi-foot .neg { color: var(--neg-hi); }
.hi-foot .pos { color: var(--pos-hi); }

.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
}
.card:hover { border-color: var(--accent); }
.card .main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.card .main strong { font-weight: 700; overflow-wrap: anywhere; }
.card .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.card .chev { color: var(--muted); }
.inl { display: inline-flex; align-items: center; gap: 5px; }
.inl .ico { width: 14px; height: 14px; }

/* Abo-Detail */
.hd {
  background: linear-gradient(155deg, var(--hero-2), var(--hero));
  color: var(--hero-ink); border-radius: 26px; padding: 14px 18px 56px;
  display: flex; flex-direction: column; gap: 18px; position: relative;
}
.hd-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; }
.hd-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,255,255,0.13); color: inherit; display: grid; place-items: center; }
.hd-btn:hover { background: rgba(255,255,255,0.2); }
.hd-main { display: flex; align-items: center; gap: 14px; }
.hd-main > div { min-width: 0; }
.hd h1 { font-size: 1.6rem; overflow-wrap: anywhere; }
.hd-sub { color: var(--hero-muted); font-size: 0.9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.menu {
  position: absolute; right: 0; top: 48px; z-index: 10; min-width: 220px; padding: 6px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: flex; flex-direction: column;
}
.mi { font: inherit; text-align: left; background: transparent; border: 0; color: inherit; cursor: pointer; padding: 11px 12px; border-radius: 10px; font-weight: 600; font-size: 0.92rem; }
.mi:hover { background: var(--surface-2); }
.mi.danger { color: var(--neg); }
.sheetcard {
  margin-top: -40px; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.sheetcard .k { margin-bottom: 4px; }
.sheetcard .v { margin-top: 0; font-size: 1.5rem; }
.sheetcard .v small { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.sheetcard .r { text-align: right; }
.sheetcard .r .v { font-size: 1.1rem; display: inline-flex; align-items: center; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.v { font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 800; margin-top: 3px; overflow-wrap: anywhere; }

.strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.pc {
  font: inherit; color: inherit; cursor: pointer; scroll-snap-align: start; flex: 0 0 104px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 0.85rem;
}
.pc[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.pc .pcn { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avwrap { position: relative; display: inline-flex; }
.dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); background: var(--pos); }
.dot.warn { background: #f08c3a; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.pline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.big { display: inline-block; font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 800; padding: 3px 10px; border-radius: 10px; }
.big.neg { background: var(--neg-bg); }
.big.pos { background: var(--pos-bg); }
.big.zero { background: var(--surface-2); }
.act { display: flex; flex-wrap: wrap; gap: 6px; }
.payform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.payform .inp { flex: 1 1 140px; min-width: 0; }

.people { list-style: none; margin: 0; padding: 0; }
.people > li { border-top: 1px solid var(--line); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.people > li:first-child { border-top: 0; }
.who { flex: 1 1 130px; min-width: 0; }
.who strong { font-weight: 700; overflow-wrap: anywhere; }
.right { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

.tl { list-style: none; margin: 0; padding: 4px 16px 8px; }
.tli { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; padding: 12px 0; position: relative; }
.tli + .tli { border-top: 0; }
.tic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: var(--pos); color: #fff; position: relative; z-index: 1; }
.tic.wait { background: #f08c3a; }
.tic .ico { width: 16px; height: 16px; stroke-width: 2.4; }
.tli:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 40px; bottom: -12px; width: 2px; background: var(--line); }
.tli .confirm { flex: 1 1 100%; }

.confirm { border: 1px solid var(--accent); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.confirm.danger { border-color: var(--neg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.inp {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 46px; width: 100%;
}
.inp::placeholder { color: var(--muted); opacity: 0.8; }
textarea.inp { font-family: var(--font-mono); font-size: 0.82rem; resize: vertical; }
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.search .inp { padding-left: 42px; }
.svc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.svc button {
  font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 0.8rem; text-align: center; overflow-wrap: anywhere;
}
.svc button:hover { border-color: var(--accent); }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 0.85rem; font-weight: 600; }
.logoed { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.symgrid, .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.symbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.symbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.stepper { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px; gap: 8px; }
.stepper .inp { text-align: center; font-weight: 700; }
.stepper .btn { padding: 0; font-size: 1.2rem; }
.prow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.prow .inp { flex: 1 1 180px; min-width: 0; width: auto; }
.prow select.inp { flex: 1 1 100%; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; flex: 0 1 auto; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: 0 0 auto; }
.share-line { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; white-space: pre-line; }
.error { color: var(--neg); font-weight: 600; min-height: 1.2em; }

details.log { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
details.log summary { cursor: pointer; padding: 14px 16px; font-weight: 700; }
.loglist { list-style: none; margin: 0; padding: 0 16px 8px; }
.loglist li { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 8px 0; border-top: 1px solid var(--line); }
.loglist time { color: var(--muted); font-size: 0.8rem; flex: 0 0 auto; font-variant-numeric: tabular-nums; }

/* Freunde, Zahlungen, Profil */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.seg button { font: inherit; font-weight: 600; font-size: 0.88rem; border: 0; border-radius: 10px; padding: 10px 6px; cursor: pointer; background: transparent; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }
.seg.small { display: inline-grid; grid-auto-columns: auto; }
.seg.small button { padding: 8px 14px; font-size: 0.82rem; }

.frow .who { flex: 1 1 auto; }
.fsubs { list-style: none; margin: 0; padding: 0 16px 14px 74px; display: flex; flex-direction: column; gap: 8px; }
.fsubs li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; justify-content: space-between; }
.aps { list-style: none; margin: 0; padding: 0; }

}

}

}

<body>

<div class="wrap" id="app"></div>
<nav id="nav" aria-label="Hauptnavigation" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// LOGIC-START
const CURRENCY = 'CHF';
const PERIODS = {
  daily:   { label: 'Täglich',     unit: 'Tag',   per: 'pro Tag' },
  weekly:  { label: 'Wöchentlich', unit: 'Woche', per: 'pro Woche' },
  monthly: { label: 'Monatlich',   unit: 'Monat', per: 'pro Monat' },
  yearly:  { label: 'Jährlich',    unit: 'Jahr',  per: 'pro Jahr' }
};
const nf = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(c) { return nf.format(Math.abs(c) / 100) + ' ' + CURRENCY; }
function signed(c) { return c === 0 ? money(0) : (c > 0 ? '+' : '−') + money(c); }
function tone(c) { return c < 0 ? 'neg' : c > 0 ? 'pos' : 'zero'; }
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function parseCents(s) {
  const v = String(s).trim().replace(/[’'\s]/g, '').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(v)) return NaN;
  return Math.round(parseFloat(v) * 100);
}

// Datum als Text "JJJJ-MM-TT", gerechnet in UTC, damit Zeitzonen nichts verschieben.
function parseISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null; }
function toISO(y, m, d) { return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
function daysInMonth(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); }
function isoPlusDays(iso, n) {
  const p = parseISO(iso), dt = new Date(Date.UTC(p.y, p.m, p.d + n));
  return toISO(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
}
function todayISO() { const t = new Date(); return toISO(t.getFullYear(), t.getMonth(), t.getDate()); }
function daysBetween(a, b) {
  const x = parseISO(a), y = parseISO(b);
  return Math.round((Date.UTC(y.y, y.m, y.d) - Date.UTC(x.y, x.m, x.d)) / 86400000);
}
function fmtDay(iso) {
  const p = parseISO(iso);
  return p ? new Date(Date.UTC(p.y, p.m, p.d)).toLocaleDateString('de-CH', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
}
function relDays(iso) {
  const n = daysBetween(todayISO(), iso);
  return n === 0 ? 'heute' : n === 1 ? 'morgen' : n === -1 ? 'gestern' : n > 1 ? 'in ' + n + ' Tagen' : 'vor ' + (-n) + ' Tagen';
}
// Nächstes Datum je Periode. Bei Monat und Jahr bleibt der ursprüngliche Tag erhalten (31. wird im Februar der 28.).
function nextChargeDate(iso, period, anchorDay) {
  const p = parseISO(iso);
  if (!p) return '';
  if (period === 'daily') return isoPlusDays(iso, 1);
  if (period === 'weekly') return isoPlusDays(iso, 7);
  let y = p.y, m = p.m;
  if (period === 'monthly') { m += 1; if (m > 11) { m = 0; y += 1; } } else { y += 1; }
  return toISO(y, m, Math.min(anchorDay || p.d, daysInMonth(y, m)));
}
// Wie viele Abbuchungen (inklusive dem Startdatum selbst) liegen bis heute? Und wann ist die nächste?
function periodsUntil(start, period, today) {
  const p = parseISO(start);
  if (!p) return { n: 0, next: '' };
  let d = start, n = 0;
  while (d <= today && n < 40000) { n++; d = nextChargeDate(d, period, p.d); }
  return { n, next: d };
}
function setChargeDate(sub, iso) {
  const p = parseISO(iso);
  sub.chargeDate = p ? iso : '';
  sub.anchorDay = p ? p.d : 0;
  sub.log.unshift({ t: Date.now(), text: p ? 'Abbuchung auf ' + fmtDay(iso) + ' gesetzt' : 'Abbuchungsdatum entfernt' });
}

// Beträge werden in Rappen (ganze Zahlen) geführt, damit nichts durch Kommazahlen driftet.
function shareOf(sub) { return Math.round(sub.totalCents / sub.people.length); }
// Ohne eigenes Konto: das eigene Profil, und Personen, deren Anteil jemand anderes bezahlt.
function isFree(p) { return !!p.isMe || !!p.sponsor; }
function coveredBy(sub, p) { return sub.people.filter(x => x.sponsor === p.id && !x.isMe); }
// Was eine Person pro Periode zahlen muss: der eigene Anteil plus die übernommenen Anteile.
function chargeFor(sub, p) { return isFree(p) ? 0 : shareOf(sub) * (1 + coveredBy(sub, p).length); }
// Übernahme nur durch eine Person mit eigenem Konto, die selbst nicht übernommen wird. idProp: 'id' oder 'key' (Formular).
function normalizeSponsors(people, idProp) {
  idProp = idProp || 'id';
  const by = new Map(people.map(p => [p[idProp], p]));
  people.forEach(p => {
    if (p.isMe) { p.sponsor = ''; return; }
    const s = p.sponsor ? by.get(p.sponsor) : null;
    if (!s || s === p || s.isMe) p.sponsor = '';
  });
  people.forEach(p => {
    if (p.sponsor) { const s = by.get(p.sponsor); if (s && s.sponsor) p.sponsor = ''; }
  });
}

// o.people: [{ key, name, email, isMe, sponsor (= key der übernehmenden Person) }]
// Liegt das Startdatum in der Vergangenheit, werden alle seither fälligen Perioden sofort berechnet.
function createSub(o, today) {
  today = today || todayISO();
  const share = Math.round(o.totalCents / o.people.length);
  const sd = parseISO(o.startDate) ? o.startDate : today;
  const per = periodsUntil(sd, o.period, today);
  const ids = new Map();
  const people = o.people.map((p, i) => {
    const id = uid();
    ids.set(p.key || ('i' + i), id);
    return { id, name: p.name, email: p.email || '', phone: p.phone || '', channel: p.channel || '', isMe: !!p.isMe, sponsor: '', balance: 0, paid: 0 };
  });
  o.people.forEach((p, i) => { people[i].sponsor = ids.get(p.sponsor) || ''; });
  normalizeSponsors(people);
  const sub = {
    id: uid(), name: o.name, period: o.period, totalCents: o.totalCents, periodNo: per.n, created: Date.now(),
    startDate: sd, chargeDate: per.next, anchorDay: parseISO(sd).d, auto: o.auto !== false,
    payments: [], people, log: [],
    logo: o.logo || '', symbol: o.symbol || '', color: o.color || ''
  };
  people.forEach(p => { p.balance = (-per.n * chargeFor(sub, p)) || 0; });
  sub.log.push({
    t: Date.now(),
    text: 'Abo angelegt. Anteil pro Person: ' + money(share) +
      (per.n > 1 ? '. ' + per.n + ' Perioden seit ' + fmtDay(sd) + ' berechnet.' : per.n === 0 ? '. Start am ' + fmtDay(sd) + '.' : '.')
  });
  return sub;
}

function addPayment(sub, personId, cents) {
  const p = sub.people.find(x => x.id === personId);
  if (!p || isFree(p) || !(cents > 0)) return false;
  p.balance += cents;
  p.paid += cents;
  sub.payments = sub.payments || [];
  sub.payments.unshift({ id: uid(), pid: p.id, name: p.name, cents, t: Date.now(), periodNo: sub.periodNo });
  sub.payments.length = Math.min(sub.payments.length, 1000);
  sub.log.unshift({ t: Date.now(), text: 'Zahlung von ' + p.name + ': ' + money(cents) });
  sub.log.length = Math.min(sub.log.length, 200);
  return true;
}
// Macht eine erfasste Zahlung rückgängig (z. B. nach einem Tippfehler).
function undoPayment(sub, payId) {
  const list = sub.payments || [];
  const i = list.findIndex(x => x.id === payId);
  if (i < 0) return false;
  const pay = list[i];
  const p = sub.people.find(x => x.id === pay.pid);
  if (p) {
    p.balance -= pay.cents;
    if (pay.periodNo === sub.periodNo) p.paid = Math.max(0, p.paid - pay.cents);
  }
  list.splice(i, 1);
  sub.log.unshift({ t: Date.now(), text: 'Zahlung von ' + pay.name + ' über ' + money(pay.cents) + ' rückgängig gemacht' });
  sub.log.length = Math.min(sub.log.length, 200);
  return true;
}
function startNextPeriod(sub, autoDue) {
  const share = shareOf(sub);
  sub.people.forEach(p => { p.paid = 0; p.balance -= chargeFor(sub, p); });
  sub.periodNo += 1;
  let extra = '';
  if (sub.chargeDate) {
    sub.chargeDate = nextChargeDate(sub.chargeDate, sub.period, sub.anchorDay);
    extra = ' Nächste Abbuchung: ' + fmtDay(sub.chargeDate) + '.';
  }
  sub.log.unshift({ t: Date.now(), text: (autoDue ? 'Automatisch zum Abbuchungsdatum ' + fmtDay(autoDue) + ': ' : '') + sub.periodNo + '. ' + PERIODS[sub.period].unit + ' gestartet. Anteil ' + money(share) + ' abgezogen.' + extra });
  sub.log.length = Math.min(sub.log.length, 200);
}
// Automatischer Periodenwechsel: Ist das Abbuchungsdatum erreicht oder vorbei, startet die nächste Periode von selbst.
// Wurde die App mehrere Perioden lang nicht geöffnet, werden alle verpassten Wechsel der Reihe nach nachgeholt.
function autoRollSub(sub, today) {
  if (sub.auto === false || !sub.chargeDate) return 0;
  let n = 0;
  while (sub.chargeDate && sub.chargeDate <= today && n < 3700) {
    startNextPeriod(sub, sub.chargeDate);
    n++;
  }
  return n;
}

// Abo bearbeiten. e.applyCurrent = true: Kontostände werden so korrigiert, als hätte die neue Einstellung
// schon in dieser Periode gegolten (für Tippfehler). false: Betrag und Personen gelten erst ab der nächsten Periode.
// e.people: [{ id (nur bei bestehenden), key, name, email, isMe, sponsor (= key) }]
function applyEdit(sub, e, today) {
  today = today || todayISO();
  const notes = [];
  const oldShare = shareOf(sub);
  const before = new Map(sub.people.map(p => [p.id, { free: isFree(p), me: !!p.isMe, charge: chargeFor(sub, p), balance: p.balance }]));
  const byId = new Map(sub.people.map(p => [p.id, p]));
  const keep = new Set(e.people.filter(p => p.id).map(p => p.id));
  if (sub.name !== e.name) { notes.push('Name: ' + sub.name + ' → ' + e.name); sub.name = e.name; }
  if (sub.period !== e.period) { notes.push('Periode: ' + PERIODS[sub.period].label + ' → ' + PERIODS[e.period].label); sub.period = e.period; }
  if (sub.totalCents !== e.totalCents) { notes.push('Betrag: ' + money(sub.totalCents) + ' → ' + money(e.totalCents)); sub.totalCents = e.totalCents; }
  sub.people.filter(p => !keep.has(p.id)).forEach(p => {
    notes.push(p.name + ' entfernt' + (!isFree(p) && p.balance !== 0 ? ' (Kontostand ' + signed(p.balance) + ' verworfen)' : ''));
  });
  sub.payments = (sub.payments || []).filter(x => keep.has(x.pid));

  const keyToId = new Map();
  const next = e.people.map((ep, i) => {
    let p = ep.id ? byId.get(ep.id) : null;
    if (p) {
      if (p.name !== ep.name) { notes.push('Name: ' + p.name + ' → ' + ep.name); p.name = ep.name; }
      if ((p.email || '') !== (ep.email || '')) notes.push('E-Mail von ' + p.name + ' geändert');
      p.email = ep.email || '';
      if ((p.phone || '') !== (ep.phone || '')) notes.push('Telefonnummer von ' + p.name + ' geändert');
      p.phone = ep.phone || ''; p.channel = ep.channel || '';
    } else {
      p = { id: uid(), name: ep.name, email: ep.email || '', phone: ep.phone || '', channel: ep.channel || '', isMe: false, sponsor: '', balance: 0, paid: 0, isNew: true };
      notes.push(ep.name + ' hinzugefügt');
    }
    keyToId.set(ep.key || ep.id || ('i' + i), p.id);
    p.isMe = !!ep.isMe;
    return p;
  });
  e.people.forEach((ep, i) => { next[i].sponsor = keyToId.get(ep.sponsor) || ''; });
  normalizeSponsors(next);
  sub.people = next;
  const nm = new Map(next.map(p => [p.id, p]));

  // Wer bisher ein eigenes Konto hatte und jetzt von jemandem übernommen wird: Stand und Zahlungen wandern mit.
  const extra = new Map();
  next.forEach(p => {
    const b = before.get(p.id);
    if (!b) return;
    if (!b.me && p.isMe) notes.push(p.name + ' ist jetzt dein Profil' + (!b.free && b.balance ? ' (Kontostand ' + signed(b.balance) + ' verworfen)' : ''));
    if (b.me && !p.isMe) notes.push(p.name + ' ist nicht mehr dein Profil');
    if (p.sponsor && !b.free) {
      const s = nm.get(p.sponsor);
      s.balance += p.balance;
      s.paid += p.paid;
      sub.payments.forEach(x => { if (x.pid === p.id) x.pid = s.id; });
      extra.set(s.id, (extra.get(s.id) || 0) + b.charge);
      notes.push(p.name + ': Anteil bezahlt jetzt ' + s.name);
      p.balance = 0; p.paid = 0;
    } else if (!p.sponsor && b.free && !b.me && !p.isMe) {
      notes.push(p.name + ' zahlt den Anteil wieder selbst');
    }
  });
  const newShare = shareOf(sub);
  next.forEach(p => {
    const b = before.get(p.id);
    if (isFree(p)) { p.balance = 0; p.paid = 0; delete p.isNew; return; }
    const oldCharge = (b && !b.free ? b.charge : 0) + (extra.get(p.id) || 0);
    if (e.applyCurrent) p.balance += oldCharge - chargeFor(sub, p);
    delete p.isNew;
  });
  if (oldShare !== newShare) {
    notes.push('Anteil pro Person ' + money(oldShare) + ' → ' + money(newShare) + (e.applyCurrent ? ', aktuelle Periode angepasst' : ', gilt ab der nächsten Periode'));
  }
  if (e.auto !== undefined && (sub.auto !== false) !== !!e.auto) {
    sub.auto = !!e.auto;
    notes.push('Automatischer Periodenwechsel ' + (sub.auto ? 'eingeschaltet' : 'ausgeschaltet'));
  }

  if (e.logo !== undefined || e.symbol !== undefined || e.color !== undefined) {
    const nl = e.logo !== undefined ? e.logo : (sub.logo || '');
    const ns = e.symbol !== undefined ? e.symbol : (sub.symbol || '');
    const nc = e.color !== undefined ? e.color : (sub.color || '');
    if (nl !== (sub.logo || '') || ns !== (sub.symbol || '') || nc !== (sub.color || '')) notes.push('Logo oder Farbe geändert');
    sub.logo = nl; sub.symbol = ns; sub.color = nc;
  }

  // Startdatum geändert: Anzahl der Perioden neu berechnen, Kontostände um die Differenz anpassen.
  let startChanged = false;
  if (e.startDate !== undefined && parseISO(e.startDate) && e.startDate !== (sub.startDate || '')) {
    const per = periodsUntil(e.startDate, sub.period, today);
    const delta = per.n - sub.periodNo;
    if (delta) sub.people.forEach(p => { if (!isFree(p)) p.balance -= delta * chargeFor(sub, p); });
    notes.push('Startdatum ' + fmtDay(e.startDate) + ': ' + per.n + ' Perioden berechnet' + (delta ? ' (' + (delta > 0 ? '+' : '') + delta + ')' : ''));
    sub.startDate = e.startDate; sub.periodNo = per.n; sub.chargeDate = per.next; sub.anchorDay = parseISO(e.startDate).d;
    startChanged = true;
  }
  const dateChanged = !startChanged && e.chargeDate !== undefined && (e.chargeDate || '') !== (sub.chargeDate || '');
  if (dateChanged) setChargeDate(sub, e.chargeDate || '');
  if (notes.length) {
    sub.log.unshift({ t: Date.now(), text: 'Abo bearbeitet: ' + notes.join('; ') });
    sub.log.length = Math.min(sub.log.length, 200);
  }
  return notes.length > 0 || dateChanged || startChanged;
}

// Vorbereitete Nachricht mit dem aktuellen Kontostand einer Person.
function balanceMessage(sub, p) {
  const per = PERIODS[sub.period];
  const covered = coveredBy(sub, p).map(x => x.name);
  const state = p.balance < 0 ? 'Noch offen: ' + money(p.balance) + '. Bitte überweise den Betrag.'
    : p.balance > 0 ? 'Guthaben: ' + money(p.balance) + '. Das wird mit der nächsten Periode verrechnet.'
    : 'Alles ausgeglichen.';
  const lines = [
    'Hallo ' + p.name + ',', '',
    'hier dein aktueller Kontostand für "' + sub.name + '" (' + per.label.toLowerCase() + ' ' + money(sub.totalCents) + ', dein Anteil ' + money(chargeFor(sub, p)) + (covered.length ? ', inkl. Anteil für ' + covered.join(', ') : '') + '):', '',
    'Kontostand: ' + signed(p.balance), state
  ];
  if (sub.chargeDate) lines.push('', 'Nächste Abbuchung: ' + fmtDay(sub.chargeDate));
  lines.push('', 'Danke dir!');
  return { subject: 'Kontostand ' + sub.name + ', ' + sub.periodNo + '. ' + per.unit, body: lines.join('\n') };
}
function summary(sub) {
  let owed = 0, credit = 0, settled = 0;
  const ext = sub.people.filter(p => !isFree(p));
  ext.forEach(p => {
    if (p.balance < 0) owed += -p.balance; else { settled++; if (p.balance > 0) credit += p.balance; }
  });
  return { owed, credit, settled, extCount: ext.length, share: shareOf(sub) };
}

// Auf einen Monat umgerechnete Kosten (für die Gesamtsumme in der Übersicht).
function monthlyCents(sub) {
  const t = sub.totalCents;
  return Math.round(sub.period === 'daily' ? t * 365 / 12 : sub.period === 'weekly' ? t * 52 / 12 : sub.period === 'yearly' ? t / 12 : t);
}
// Alle Personen über alle Abos hinweg, nach Name zusammengefasst. Das eigene Profil zählt nicht als Freund.
function friendsOverview(subs) {
  const map = new Map();
  subs.forEach(s => s.people.forEach(p => {
    const key = p.name.trim().toLowerCase();
    let f = map.get(key);
    if (!f) { f = { key, name: p.name.trim(), subs: [], balance: 0, monthly: 0, hasAccount: false, onlyMine: true }; map.set(key, f); }
    if (!p.isMe) f.onlyMine = false;
    const sp = p.sponsor ? s.people.find(x => x.id === p.sponsor) : null;
    f.subs.push({ subId: s.id, subName: s.name, balance: p.balance, free: isFree(p), me: !!p.isMe, via: sp ? sp.name : '' });
    if (!isFree(p)) {
      f.balance += p.balance; f.hasAccount = true;
      f.monthly += Math.round(monthlyCents(s) * (1 + coveredBy(s, p).length) / s.people.length);
    }
  }));
  return [...map.values()].filter(f => !f.onlyMine).sort((a, b) => (a.balance - b.balance) || a.name.localeCompare(b.name, 'de'));
}
// Zahlungsliste über alle Abos: offene Beträge zuerst, dann erfasste Zahlungen, neueste oben.
function txItems(subs, filter) {
  const outs = [], ins = [];
  subs.forEach(s => {
    if (filter !== 'out') (s.payments || []).forEach(x => ins.push({ kind: 'in', t: x.t, sub: s, name: x.name, cents: x.cents, periodNo: x.periodNo }));

function fillTemplate(text, sub, p, o) {
  o = o || {};

  const status = p.balance < 0 ? 'Noch offen: ' + money(p.balance) + '. Bitte überweise den Betrag.'
    : p.balance > 0 ? 'Guthaben: ' + money(p.balance) + '. Das wird mit der nächsten Periode verrechnet.' : 'Alles ausgeglichen.';
  const v = {
    name: p.name, abo: sub.name, betrag: p.balance < 0 ? money(p.balance) : money(0), stand: signed(p.balance),
    anteil: money(chargeFor(sub, p)), total: money(sub.totalCents), zyklus: per.label.toLowerCase(),
    periode: sub.periodNo + '. ' + per.unit, datum: sub.chargeDate ? fmtDay(sub.chargeDate) : '',
    status, inkl: cov.length ? ', inkl. Anteil für ' + cov.join(', ') : '', absender: o.sender || '', hinweis: o.hinweis || '',
    tage: o.days != null ? String(o.days) : ''

    const keys = line.match(/\{(\w+)\}/g);
    if (!keys) return true;

    return !keys.every(k => (v[k.slice(1, -1)] || '') === '');

function normPhone(s, cc) {

function dueReminders(subs, settings, today, sent) {

    if (s.periodNo < 1) return;
    const toCharge = s.chargeDate ? daysBetween(today, s.chargeDate) : null;

  `;
}

function dueItems() {
  if (state.settings.mode !== 'ask') return [];
  return dueReminders(state.subs, state.settings, todayISO(), state.sent);
}
function markSent(c) {
  const today = todayISO();
  if (c.key) state.sent[c.key] = today;
  dueItems().filter(x => x.p.id === c.pid && x.sub.id === ui.id).forEach(x => { state.sent[x.key] = today; });
  const ks = Object.keys(state.sent);
  if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(k => delete state.sent[k]);
}
function dueHtml() {
  const items = dueItems();
  if (!items.length) return '';
  return `<section class="panel" aria-label="Erinnerungen">
    <div class="pad" style="padding-bottom:4px"><div class="sec"><h2>Erinnerungen</h2><span class="pill pill-wait">${items.length}</span></div></div>
    <ul class="people">${items.map(it => `<li>
      ${subTile(it.sub)}
      <div class="who"><strong>${esc(it.p.name)}</strong> <span class="muted small">· ${esc(it.sub.name)}</span>
        <div class="small ${it.type === 'overdue' ? 'neg' : 'muted'}">${it.type === 'overdue' ? 'Seit ' + it.days + ' Tagen offen: ' + money(-it.p.balance) : 'Zahltag ' + relDays(it.sub.chargeDate)}</div></div>
      <div class="act"><button class="btn btn-sm btn-primary" data-act="due-send" data-key="${esc(it.key)}">${CHANNELS[channelOf(it.p, state.settings)]}</button><button class="btn btn-sm btn-quiet" data-act="due-done" data-key="${esc(it.key)}">Erledigt</button></div>
    </li>`).join('')}</ul></section>`;
}
function notifyDue() {
  try {
    if (!state.settings.notif || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const items = dueItems(), key = 'notif|' + todayISO() + '|' + items.length;
    if (!items.length || state.sent[key]) return;
    state.sent[key] = todayISO(); save();
    new Notification('Abo-Splitter', { body: items.length + (items.length === 1 ? ' Erinnerung ist fällig.' : ' Erinnerungen sind fällig.') });
  } catch (e) {}
}
function senderName() { return (state.profile.name || '').trim(); }
function buildMsg(s, p, type, days) {
  return composeMessage(s, p, state.settings, { sender: senderName(), hinweis: hinweisFor(type, s, days), days });
}
function openCompose(s, p, type, days) {

}

function readImage(file, max, square, cb) {
  if (!file || !/^image\//.test(file.type)) { toast('Bitte eine Bilddatei wählen'); return; }
  const fr = new FileReader();
  fr.onerror = () => toast('Die Datei konnte nicht gelesen werden');
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => toast('Das Bild konnte nicht gelesen werden');
    img.onload = () => {
      const w = img.naturalWidth || 128, h = img.naturalHeight || 128;
      const side = square ? Math.min(w, h) : 0;
      const sc = Math.min(1, max / (square ? side : Math.max(w, h)));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round((square ? side : w) * sc)); cv.height = Math.max(1, Math.round((square ? side : h) * sc));
      const g = cv.getContext('2d');
      if (square) g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, cv.width, cv.height);
      else g.drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL(square ? 'image/jpeg' : 'image/png', 0.85));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function updateShare() {

  const d = ui.draft, c = parseCents(d.total), n = d.people.length;
  const share = (c > 0 && n >= 2) ? Math.round(c / n) : 0;
  const cur = d.editId ? getSub() : null;
  let t = 'Anteil pro Person: ' + (cur ? money(shareOf(cur)) + ' → ' : '') + (share ? money(share) : '–');
  const sd = parseISO(d.start) ? d.start : (d.editId ? '' : todayISO());
  if (sd) {
    const per = periodsUntil(sd, d.period, todayISO());
    t += '\n' + (per.n === 0
      ? 'Startet am ' + fmtDay(sd) + '.'
      : 'Seit ' + fmtDay(sd) + ': ' + per.n + (per.n === 1 ? ' Periode' : ' Perioden') + ' berechnet, nächste Abbuchung ' + fmtDay(per.next) + '.');
    if (cur && sd !== (cur.startDate || '') && per.n !== cur.periodNo) {
      t += '\nBisher ' + cur.periodNo + ' Perioden. Die Kontostände werden um die Differenz angepasst.';
    }
  }
  el.textContent = t;
}
function dateProblem(d) {
  const cur = d.editId ? getSub() : null;
  if (!cur || !d.auto || !d.charge) return '';
  const startChanged = d.start && d.start !== (cur.startDate || '');

    return 'Das Datum der nächsten Abbuchung muss in der Zukunft liegen, damit die Periode automatisch wechseln kann. Gib ein späteres Datum ein oder schalte den automatischen Wechsel aus.';

function resizeDraft(d, n) {

// Navigation: Jede Ansicht ist ein Eintrag im Browserverlauf, damit die Zurück-Taste (auch am Handy)
// eine Seite zurückgeht, statt die App zu schliessen. navDepth zählt nur die Einträge, die die App selbst angelegt hat.
let navDepth = 0;
function show(view, id) {
  ui.view = view; ui.id = id || null;
  ui.pay = null; ui.menu = false; ui.confirm = null; ui.editDate = false; ui.msgFor = null; ui.compose = null; ui.undoId = null; ui.remind = false;
  if (view !== 'new' && view !== 'edit') ui.draft = null;
  render();
}
function navTo(view, id) {
  try { history.pushState({ v: view, id: id || null, d: navDepth + 1 }, ''); navDepth += 1; } catch (e) {}
  show(view, id);
}
function replaceTo(view, id) {
  try { history.replaceState({ v: view, id: id || null, d: navDepth }, ''); } catch (e) {}
  show(view, id);
}
function goBack(fallbackView, fallbackId) {
  if (navDepth > 0) {
    try { history.back(); return; } catch (e) {}
  }
  show(fallbackView || 'list', fallbackId);
}
function goTab(v) {
  if (ui.view === v) return;
  if (v === 'list') goBack('list');
  else if (ui.view === 'list') navTo(v);
  else replaceTo(v);
}
window.addEventListener('popstate', e => {
  const st = e.state || { v: 'list', id: null, d: 0 };
  navDepth = st.d || 0;
  let v = st.v || 'list', id = st.id || null;
  if ((v === 'new' || v === 'edit') && (!ui.draft || (v === 'edit' && ui.draft.editId !== id))) v = id ? 'detail' : 'list';
  if ((v === 'detail' || v === 'edit') && !state.subs.some(s => s.id === id)) { v = 'list'; id = null; }
  if (!['list', 'friends', 'payments', 'profile', 'detail', 'new', 'edit'].includes(v)) v = 'list';
  show(v, id);
});
try { history.replaceState({ v: 'list', id: null, d: 0 }, ''); } catch (e) {}

function savePay(box) {
  const s = getSub();
  if (!s) return;
  const input = document.getElementById('pay-input');
  const cents = parseCents(input.value);
  const err = document.getElementById('pay-error');
  if (!(cents > 0)) { err.textContent = 'Bitte einen Betrag grösser als 0 eingeben, z. B. 9 oder 9.50.'; return; }
  const p = s.people.find(x => x.id === box.dataset.pid);
  addPayment(s, box.dataset.pid, cents);
  save(); ui.pay = null; rerenderKeepScroll();
  toast('Zahlung von ' + (p ? p.name : '') + ' erfasst: ' + money(cents));
}
function readDraftPeople(d, withId) {
  return d.people.map((p, i) => {
    const o = { key: p.key, name: p.name.trim() || ('Person ' + (i + 1)), isMe: p.isMe, email: p.isMe ? '' : (p.email || '').trim(), phone: p.isMe ? '' : (p.phone || '').trim(), channel: p.isMe ? '' : (p.channel || ''), sponsor: p.isMe ? '' : p.sponsor };
    if (withId && p.id) o.id = p.id;
    return o;
  });
}
function draftError(d) {
  const total = parseCents(d.total);
  if (!d.name.trim()) return 'Bitte einen Namen für den Service eingeben.';
  if (!(total > 0)) return 'Bitte nur den Betrag eingeben, grösser als 0, z. B. 30 oder 12.90 (ohne "CHF").';
  if (d.people.length < 2) return 'Es braucht mindestens zwei Personen.';
  if (d.start && !parseISO(d.start)) return 'Bitte ein gültiges Startdatum wählen.';
  const bad = d.people.find(p => !p.isMe && (p.email || '').trim() && !/^\S+@\S+\.\S+$/.test(p.email.trim()));
  if (bad) return 'Die E-Mail-Adresse von ' + pLabel(bad, d.people.indexOf(bad)) + ' sieht nicht richtig aus.';
  const badp = d.people.find(p => !p.isMe && (p.phone || '').trim() && !normPhone(p.phone, state.settings.cc));
  if (badp) return 'Die Telefonnummer von ' + pLabel(badp, d.people.indexOf(badp)) + ' sieht nicht richtig aus. Beispiel: 079 123 45 67 oder +41 79 123 45 67.';
  return dateProblem(d);
}
function saveEdit() {
  const d = ui.draft, err = document.getElementById('d-error'), s = getSub();
  if (!d || !s) return;
  const problem = draftError(d);
  if (problem) { err.textContent = problem; return; }
  const changed = applyEdit(s, {
    name: d.name.trim(), logo: d.logo, symbol: d.symbol, color: d.color, period: d.period, totalCents: parseCents(d.total), startDate: d.start, chargeDate: d.charge,
    auto: d.auto, people: readDraftPeople(d, true), applyCurrent: d.applyCurrent
  });
  save();
  goBack('detail', s.id);
  toast(changed ? 'Änderungen gespeichert' : 'Keine Änderungen');
}
function saveNew() {
  const d = ui.draft, err = document.getElementById('d-error');
  if (!d) return;
  if (d.editId) return saveEdit();
  const problem = draftError(d);
  if (problem) { err.textContent = problem; return; }
  const sub = createSub({
    name: d.name.trim(), logo: d.logo, symbol: d.symbol, color: d.color, period: d.period, totalCents: parseCents(d.total), startDate: d.start || todayISO(),
    auto: d.auto, people: readDraftPeople(d, false)
  });

}
function stepCount(delta) {
  const d = ui.draft;
  if (!d) return;
  const n = Math.min(30, Math.max(2, d.people.length + delta));
  if (n === d.people.length) return;
  resizeDraft(d, n);
  const c = document.getElementById('d-count'); if (c) c.value = n;
  document.getElementById('d-people').innerHTML = draftPeopleHtml();
  updateShare();
}

function handleClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) { if (ui.menu) { ui.menu = false; rerenderKeepScroll(); } return; }
  const a = el.dataset.act;
  if (a !== 'menu') ui.menu = false;
  const pr = ui.prof;
  if (a === 'open') navTo('detail', el.dataset.id);
  else if (a === 'tab') goTab(el.dataset.v);
  else if (a === 'welcome-go') { try { localStorage.setItem(WKEY, '1'); } catch (err) {} show('list'); }
  else if (a === 'back') goBack('list');
  else if (a === 'new') { ui.draft = newDraft(); navTo('new'); }
  else if (a === 'svc') {
    const d = ui.draft;
    if (d) { d.name = el.dataset.name; const n = document.getElementById('d-name'); if (n) n.value = d.name; const t = document.getElementById('d-total'); if (t) t.focus(); }
  }
  else if (a === 'count-dec') stepCount(-1);
  else if (a === 'count-inc') stepCount(1);
  else if (a === 'menu') { ui.menu = !ui.menu; rerenderKeepScroll(); }
  else if (a === 'sel') { ui.sel = el.dataset.pid; ui.pay = null; ui.compose = null; rerenderKeepScroll(); }
  else if (a === 'unit') { ui.unit = el.dataset.u; rerenderKeepScroll(); }
  else if (a === 'theme') { try { localStorage.setItem(THKEY, el.dataset.t); } catch (err) {} applyTheme(el.dataset.t); rerenderKeepScroll(); }
  else if (a === 'photo-clear') { state.profile.photo = ''; save(); rerenderKeepScroll(); }
  else if (a === 'logo-clear') { ui.draft.logo = ''; refreshLogo(); }
  else if (a === 'sym') { ui.draft.symbol = el.dataset.k; ui.draft.logo = ''; refreshLogo(); }
  else if (a === 'color') { ui.draft.color = el.dataset.c; refreshLogo(); }
  else if (a === 'pay-open') { ui.pay = el.dataset.pid; ui.sel = el.dataset.pid; rerenderKeepScroll(); }
  else if (a === 'pay-cancel') { ui.pay = null; rerenderKeepScroll(); }
  else if (a === 'pay-save') savePay(el.closest('[data-form]'));
  else if (a === 'remind') { ui.remind = !ui.remind; ui.compose = null; rerenderKeepScroll(); }
  else if (a === 'undo-ask') { ui.undoId = el.dataset.id; rerenderKeepScroll(); }
  else if (a === 'undo-no') { ui.undoId = null; rerenderKeepScroll(); }
  else if (a === 'undo-yes') {
    const s = getSub();
    if (s && undoPayment(s, el.dataset.id)) { save(); toast('Zahlung rückgängig gemacht'); }
    ui.undoId = null; rerenderKeepScroll();
  }
  else if (a === 'next-ask') { ui.confirm = 'next'; rerenderKeepScroll(); }
  else if (a === 'delete-ask') { ui.confirm = 'delete'; rerenderKeepScroll(); }
  else if (a === 'confirm-cancel') { ui.confirm = null; rerenderKeepScroll(); }
  else if (a === 'next-yes') {
    const s = getSub();
    if (s) { startNextPeriod(s); save(); toast(s.periodNo + '. ' + PERIODS[s.period].unit + ' gestartet'); }
    ui.confirm = null; ui.pay = null; rerenderKeepScroll();
  }
  else if (a === 'delete-yes') {
    state.subs = state.subs.filter(s => s.id !== ui.id);
    save(); ui.confirm = null; goBack('list'); toast('Abo gelöscht');
  }
  else if (a === 'save-new') saveNew();
  else if (a === 'date-edit') { ui.editDate = true; rerenderKeepScroll(); }
  else if (a === 'date-cancel') { ui.editDate = false; rerenderKeepScroll(); }
  else if (a === 'date-save') {
    const s = getSub(), v = document.getElementById('edit-charge').value;
    if (s && s.auto !== false && v && v <= todayISO()) {
      document.getElementById('date-error').textContent = 'Das Datum muss in der Zukunft liegen, sonst wechselt die Periode sofort. Den automatischen Wechsel kannst du unter "Bearbeiten" ausschalten.';
      return;
    }
    if (s) { setChargeDate(s, v); save(); toast(s.chargeDate ? 'Abbuchung auf ' + fmtDay(s.chargeDate) + ' gesetzt' : 'Abbuchungsdatum entfernt'); }
    ui.editDate = false; rerenderKeepScroll();
  }
  else if (a === 'edit') {
    const s = getSub();
    if (s) {
      ui.draft = {
        editId: s.id, name: s.name, logo: s.logo || '', symbol: s.symbol || '', color: s.color || '', period: s.period, total: (s.totalCents / 100).toFixed(2),
        start: s.startDate || '', charge: s.chargeDate || '', auto: s.auto !== false,
        count: s.people.length, removed: [], applyCurrent: true,
        people: s.people.map(p => ({ id: p.id, key: p.id, name: p.name, email: p.email || '', phone: p.phone || '', channel: p.channel || '', isMe: p.isMe, sponsor: p.sponsor || '', balance: p.balance }))
      };
      navTo('edit', s.id);
    }
  }
  else if (a === 'cancel-edit') { const s = getSub(); goBack('detail', s && s.id); }
  else if (a === 'draft-add') {
    const d = ui.draft;
    if (d && d.people.length < 30) {
      resizeDraft(d, d.people.length + 1);
      document.getElementById('d-people').innerHTML = draftPeopleHtml(); updateShare();
      const ins = document.querySelectorAll('[data-draft="pname"]'); if (ins.length) ins[ins.length - 1].focus();
    }
  }
  else if (a === 'draft-remove') {
    const d = ui.draft;
    if (d && d.people.length > 2) {
      const p = d.people.splice(+el.dataset.i, 1)[0];
      if (p.id) d.removed.push({ name: p.name.trim() || 'Person', balance: (p.isMe || p.sponsor) ? 0 : p.balance });
      normalizeDraft(d);
      document.getElementById('d-people').innerHTML = draftPeopleHtml(); updateShare();
    }
  }
  else if (a === 'compose-open') {
    const s = getSub(), p = s && s.people.find(x => x.id === el.dataset.pid);
    if (p) { openCompose(s, p); ui.sel = p.id; rerenderKeepScroll(); const t = document.getElementById('c-text'); if (t) t.focus({ preventScroll: true }); }
  }
  else if (a === 'compose-close') { ui.compose = null; rerenderKeepScroll(); }
  else if (a === 'compose-reset') {
    const s = getSub(), c = ui.compose, p = s && c && s.people.find(x => x.id === c.pid);
    if (p) { const ch = c.ch; openCompose(s, p, c.type, c.days); ui.compose.ch = ch; rerenderKeepScroll(); }
  }
  else if (a === 'cch') { ui.compose.ch = el.dataset.c; rerenderKeepScroll(); }
  else if (a === 'compose-sent') {
    if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); toast('Es fehlt noch ' + (ui.compose.ch === 'mail' ? 'die E-Mail-Adresse' : 'die Telefonnummer')); return; }
    markSent(ui.compose); save();
    toast('Nachricht geöffnet. Zum Senden in der App bestätigen.');
  }
  else if (a === 'copy-msg') {
    const t = document.getElementById('c-text');
    if (!t) return;
    const fail = () => { t.focus(); t.select(); toast('Text markiert, bitte selbst kopieren'); };
    try { navigator.clipboard.writeText(t.value).then(() => toast('Nachricht kopiert'), fail); } catch (err) { fail(); }
  }
  else if (a === 'due-send') {
    const it = dueItems().find(x => x.key === el.dataset.key);
    if (it) { ui.id = it.sub.id; navTo('detail', it.sub.id); ui.sel = it.p.id; openCompose(it.sub, it.p, it.type, it.days); ui.compose.key = it.key; rerenderKeepScroll(); }
  }
  else if (a === 'due-done') { state.sent[el.dataset.key] = todayISO(); save(); rerenderKeepScroll(); }
  else if (a === 'notif-on') {
    try {
      Notification.requestPermission().then(r => { state.settings.notif = r === 'granted'; save(); rerenderKeepScroll(); toast(r === 'granted' ? 'Mitteilungen eingeschaltet' : 'Der Browser hat Mitteilungen nicht erlaubt'); });
    } catch (err) { toast('Dieser Browser unterstützt keine Mitteilungen'); }
  }
  else if (a === 'notif-off') { state.settings.notif = false; save(); rerenderKeepScroll(); }
  else if (a === 'tpl-reset') { state.settings.tpl = { subject: DEFAULT_TPL.subject, body: DEFAULT_TPL.body }; save(); rerenderKeepScroll(); toast('Standardvorlage wiederhergestellt'); }
  else if (a === 'set-ch') { state.settings.defChannel = el.dataset.c; save(); rerenderKeepScroll(); }
  else if (a === 'set-mode') { state.settings.mode = el.dataset.m; save(); rerenderKeepScroll(); }
  else if (a === 'friend-toggle') { ui.openFriend = ui.openFriend === el.dataset.key ? null : el.dataset.key; rerenderKeepScroll(); }
  else if (a === 'filter') { ui.filter = el.dataset.f; rerenderKeepScroll(); }
  else if (a === 'backup-show') { pr.backup = true; rerenderKeepScroll(); }
  else if (a === 'backup-hide') { pr.backup = false; rerenderKeepScroll(); }
  else if (a === 'backup-copy') {
    const t = document.getElementById('backup-text');
    const fail = () => { if (t) { t.focus(); t.select(); } toast('Text markiert, bitte selbst kopieren'); };
    try { navigator.clipboard.writeText(JSON.stringify(state)).then(() => toast('Sicherung kopiert'), fail); } catch (err) { fail(); }
  }
  else if (a === 'restore-show') { pr.restore = true; pr.pending = null; pr.err = ''; rerenderKeepScroll(); }
  else if (a === 'restore-hide' || a === 'restore-no') { pr.restore = false; pr.pending = null; pr.err = ''; rerenderKeepScroll(); }
  else if (a === 'restore-check') {
    const raw = document.getElementById('restore-text').value.trim();
    let obj = null;
    try { obj = JSON.parse(raw); } catch (err) {}
    if (!validState(obj)) { pr.err = 'Das ist keine gültige Sicherung. Bitte den ganzen kopierten Text einfügen.'; pr.pending = null; }
    else { pr.err = ''; pr.pending = obj; }
    rerenderKeepScroll();
    const t = document.getElementById('restore-text'); if (t && pr.pending) t.value = raw;
  }
  else if (a === 'restore-yes') {
    if (pr.pending) { state = migrate(pr.pending); save(); toast('Sicherung eingespielt'); }

  else if (a === 'wipe-no') { pr.wipe = false; rerenderKeepScroll(); }
  else if (a === 'wipe-yes') { state = migrate({ subs: [] }); save(); pr.wipe = false; toast('Alle Daten gelöscht'); rerenderKeepScroll(); }
}
app.addEventListener('click', handleClick);
nav.addEventListener('click', handleClick);
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
  const box = e.target.closest('[data-form]');
  if (!box) return;
  e.preventDefault();
  if (box.dataset.form === 'pay') savePay(box); else if (box.dataset.form === 'new') saveNew();
});
app.addEventListener('toggle', e => {
  const k = e.target && e.target.dataset && e.target.dataset.d;
  if (k) ui.open[k] = e.target.open;
}, true);

app.addEventListener('input', e => {
  const dt = e.target.dataset;
  if (dt.c) {
    const c = ui.compose, s = getSub(), p = s && c && s.people.find(x => x.id === c.pid);
    if (!c || !p) return;
    if (dt.c === 'text') c.text = e.target.value;
    else if (dt.c === 'subject') c.subject = e.target.value;
    else if (dt.c === 'contact') { if (c.ch === 'mail') p.email = e.target.value.trim(); else p.phone = e.target.value.trim(); save(); }
    const go = document.getElementById('compose-go'), link = composeLink(), hint = document.getElementById('c-hint');
    if (go) { if (link) { go.setAttribute('href', link); go.removeAttribute('aria-disabled'); } else { go.removeAttribute('href'); go.setAttribute('aria-disabled', 'true'); } }
    if (hint) hint.textContent = link ? '' : (c.ch === 'mail' ? 'Bitte eine gültige E-Mail-Adresse eintragen.' : 'Bitte eine gültige Telefonnummer eintragen, z. B. 079 123 45 67 oder +41 79 123 45 67.');
    return;
  }
  if (dt.set) {
    const st = state.settings, v = e.target.value;
    if (dt.set === 'tplSubject') st.tpl.subject = v;
    else if (dt.set === 'tplBody') { if (v.trim()) st.tpl.body = v; }
    else if (dt.set === 'cc') st.cc = v.replace(/\D/g, '') || '41';
    else if (dt.set === 'soonDays') st.soonDays = Math.min(60, Math.max(0, parseInt(v, 10) || 0));
    else if (dt.set === 'overdueDays') st.overdueDays = Math.min(365, Math.max(1, parseInt(v, 10) || 1));
    save();
    return;
  }
  if (e.target.dataset.prof === 'name') { state.profile.name = e.target.value; save(); return; }
  const t = e.target, k = t.dataset.draft, d = ui.draft;
  if (!k || !d) return;
  if (k === 'svcsearch') {
    const q = t.value.trim().toLowerCase();
    let any = false;
    document.querySelectorAll('[data-svc]').forEach(b => { const hit = !q || b.dataset.svc.toLowerCase().includes(q); b.hidden = !hit; if (hit) any = true; });
    const none = document.getElementById('svc-none'); if (none) none.hidden = any;
    return;
  }
  if (k === 'name') { d.name = t.value; if (!d.logo) refreshLogo(); }
  else if (k === 'total') { d.total = t.value; updateShare(); }
  else if (k === 'start') { d.start = t.value; updateShare(); }
  else if (k === 'charge') d.charge = t.value;
  else if (k === 'pname') { d.people[+t.dataset.i].name = t.value; refreshSponsorLabels(); }
  else if (k === 'pemail') d.people[+t.dataset.i].email = t.value;
  else if (k === 'pphone') d.people[+t.dataset.i].phone = t.value;
  else if (k === 'count') {
    const n = parseInt(t.value, 10);
    if (n >= 2 && n <= 30) {
      resizeDraft(d, n);
      document.getElementById('d-people').innerHTML = draftPeopleHtml();
      updateShare();
    }
  }
});
app.addEventListener('change', e => {
  if (e.target.dataset.set === 'soonOn' || e.target.dataset.set === 'overdueOn') { state.settings[e.target.dataset.set] = e.target.checked; save(); return; }
  if (e.target.dataset.prof === 'photo') {

    return;
  }
  if (e.target.dataset.draft === 'logofile') {
    const f = e.target.files && e.target.files[0];

    return;
  }
  const t = e.target, k = t.dataset.draft, d = ui.draft;

    d.people[+t.dataset.i].channel = t.value;
  } else if (k === 'psponsor') {
    d.people[+t.dataset.i].sponsor = t.value;
    normalizeDraft(d);
    document.getElementById('d-people').innerHTML = draftPeopleHtml();
  }
});

// Täglich aktuell: Beim Öffnen, beim Zurückkehren zur Seite und um Mitternacht werden fällige Perioden gestartet.
function rollAll() {
  const today = todayISO(), msgs = [];
  state.subs.forEach(s => {
    const n = autoRollSub(s, today);
    if (n) msgs.push(s.name + ': ' + s.periodNo + '. ' + PERIODS[s.period].unit + (n > 1 ? ' (' + n + ' Wechsel nachgeholt)' : ' automatisch gestartet'));
  });
  if (msgs.length) save();
  return msgs;
}
let lastDay = todayISO();
function tick() {
  const today = todayISO();
  if (today === lastDay) return;
  // Während einer Eingabe nicht dazwischenfunken, der nächste Takt versucht es erneut.
  if (ui.view === 'new' || ui.view === 'edit' || ui.pay || ui.confirm || ui.editDate || ui.undoId) return;
  lastDay = today;
  const m = rollAll();
  rerenderKeepScroll();
  notifyDue();
  if (m.length) toast(m.join(' · '));
}
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

const startMsgs = rollAll();
render();
notifyDue();
if (startMsgs.length) toast(startMsgs.join(' · '));
</script>
